<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="arrakisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1405" />
      <stop offset="35%" stop-color="#5A280B" />
      <stop offset="70%" stop-color="#1E140C" />
      <stop offset="100%" stop-color="#0A0806" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#B45309" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5A280B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#arrakisBg)" rx="16" />

  <!-- Twin Suns of Arrakis -->
  <circle cx="200" cy="150" r="85" fill="url(#sun)" />
  <circle cx="280" cy="110" r="30" fill="#FDE047" opacity="0.6" />

  <!-- Desert Sand Dunes Silhouette -->
  <path d="M 0,270 Q 110,210 220,260 T 400,230 L 400,340 L 0,340 Z" fill="#92400E" opacity="0.6" />
  <path d="M 0,290 Q 150,240 280,310 T 400,280 L 400,340 L 0,340 Z" fill="#78350F" opacity="0.8" />
  <path d="M 0,320 Q 80,290 180,330 T 400,300 L 400,340 L 0,340 Z" fill="#451A03" />

  <!-- Desert Traveler Silhouettes -->
  <g transform="translate(190, 240) scale(0.7)" fill="#1C1917">
    <ellipse cx="0" cy="-20" rx="6" ry="8" />
    <path d="M -8,-10 L 8,-10 L 12,20 L -12,20 Z" />
    <!-- Crysknife / staff -->
    <line x1="14" y1="-25" x2="14" y2="20" stroke="#1C1917" stroke-width="2" />
  </g>

  <!-- Genre Tag -->
  <rect x="130" y="340" width="140" height="26" rx="13" fill="#E50914" opacity="0.9" />
  <text x="200" y="357" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SCI-FI / ADVENTURE</text>

  <!-- Title & Details -->
  <text x="200" y="420" font-family="'Poppins', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DUNE: PART TWO</text>
  <text x="200" y="445" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="2">LONG LIVE THE FIGHTERS</text>

  <!-- Rating & Duration -->
  <g transform="translate(130, 485)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="url(#gold)" font-weight="700">★ 8.6 / 10</text>
    <text x="140" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="#CBD5E1" font-weight="500">⏱ 166 MIN</text>
  </g>

  <!-- Ticket Price Tag -->
  <rect x="50" y="525" width="300" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="200" y="551" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#F8FAFC" text-anchor="middle">
    TICKETS FROM <tspan fill="#F59E0B">₹290.00</tspan>
  </text>
</svg>
