<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="oppBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C0A00" />
      <stop offset="35%" stop-color="#431407" />
      <stop offset="65%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <radialGradient id="blast" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#F97316" />
      <stop offset="60%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#1C0A00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#oppBg)" rx="16" />

  <!-- Nuclear blast fire cloud / Trinity test -->
  <circle cx="200" cy="180" r="120" fill="url(#blast)" opacity="0.95" />
  
  <!-- Silhouette of Hat / Man -->
  <g transform="translate(200, 240)">
    <!-- Hat Brim -->
    <ellipse cx="0" cy="-35" rx="55" ry="10" fill="#09090B" />
    <!-- Hat Crown -->
    <path d="M -30,-35 C -25,-65 25,-65 30,-35 Z" fill="#09090B" />
    <!-- Head/Shoulders -->
    <circle cx="0" cy="-20" r="22" fill="#09090B" />
    <path d="M -50,20 C -40,-10 40,-10 50,20 Z" fill="#09090B" />
  </g>

  <!-- Genre Tag -->
  <rect x="130" y="340" width="140" height="26" rx="13" fill="#E50914" opacity="0.9" />
  <text x="200" y="357" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BIOGRAPHY / DRAMA</text>

  <!-- Title & Details -->
  <text x="200" y="420" font-family="'Poppins', sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">OPPENHEIMER</text>
  <text x="200" y="445" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="2">THE WORLD FOREVER CHANGES</text>

  <!-- Rating & Duration -->
  <g transform="translate(130, 485)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="url(#gold)" font-weight="700">★ 8.9 / 10</text>
    <text x="140" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="#CBD5E1" font-weight="500">⏱ 180 MIN</text>
  </g>

  <!-- Ticket Price Tag -->
  <rect x="50" y="525" width="300" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="200" y="551" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#F8FAFC" text-anchor="middle">
    TICKETS FROM <tspan fill="#F59E0B">₹270.00</tspan>
  </text>
</svg>
