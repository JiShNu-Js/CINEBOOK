<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="gothamBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="35%" stop-color="#0D1B2A" />
      <stop offset="70%" stop-color="#1B263B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="batSignal" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#CA8A04" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#gothamBg)" rx="16" />

  <!-- Gotham City Skyline Silhouette -->
  <g fill="#070D18" opacity="0.8">
    <rect x="20" y="220" width="40" height="120" />
    <rect x="70" y="180" width="50" height="160" />
    <polygon points="95,140 70,180 120,180" />
    <rect x="130" y="240" width="35" height="100" />
    <rect x="235" y="230" width="40" height="110" />
    <rect x="285" y="170" width="45" height="170" />
    <polygon points="307,130 285,170 330,170" />
    <rect x="340" y="210" width="40" height="130" />
  </g>

  <!-- Bat-signal light beam -->
  <circle cx="200" cy="180" r="100" fill="url(#batSignal)" />
  
  <!-- Bat Symbol Emblem -->
  <g transform="translate(200, 180) scale(0.95)" fill="#0A0F1D">
    <path d="M 0,-15 C 10,-35 30,-30 45,-15 C 75,-25 90,5 85,25 C 70,10 50,20 35,35 C 20,20 10,25 0,40 C -10,25 -20,20 -35,35 C -50,20 -70,10 -85,25 C -90,5 -75,-25 -45,-15 C -30,-30 -10,-35 0,-15 Z" />
  </g>

  <!-- Genre Tag -->
  <rect x="140" y="340" width="120" height="26" rx="13" fill="#E50914" opacity="0.9" />
  <text x="200" y="357" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ACTION / CRIME</text>

  <!-- Title & Details -->
  <text x="200" y="420" font-family="'Poppins', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">THE DARK KNIGHT</text>
  <text x="200" y="445" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="2">WHY SO SERIOUS?</text>

  <!-- Rating & Duration -->
  <g transform="translate(130, 485)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="url(#gold)" font-weight="700">★ 9.0 / 10</text>
    <text x="140" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="#CBD5E1" font-weight="500">⏱ 152 MIN</text>
  </g>

  <!-- Ticket Price Tag -->
  <rect x="50" y="525" width="300" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="200" y="551" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#F8FAFC" text-anchor="middle">
    TICKETS FROM <tspan fill="#F59E0B">₹260.00</tspan>
  </text>
</svg>
