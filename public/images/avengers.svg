<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="endgameBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14061F" />
      <stop offset="35%" stop-color="#2E1065" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="avengersA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#endgameBg)" rx="16" />

  <!-- Cosmic energy waves -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#C084FC" stroke-width="2" opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.25" />

  <!-- Iconic 'A' Logo -->
  <g transform="translate(140, 90)">
    <!-- Ring -->
    <path d="M 60,10 A 80,80 0 1,0 120,130" fill="none" stroke="url(#avengersA)" stroke-width="14" stroke-linecap="round" />
    <!-- Letter A legs & crossbar -->
    <path d="M 60,15 L 20,155 L 42,155 L 53,115 L 90,115 L 85,95 L 58,95 L 68,55 Z" fill="url(#avengersA)" />
    <!-- Arrow pointing right-up -->
    <polygon points="50,115 130,115 110,85 140,115 110,145 130,115" fill="#38BDF8" />
  </g>

  <!-- Genre Tag -->
  <rect x="140" y="340" width="120" height="26" rx="13" fill="#E50914" opacity="0.9" />
  <text x="200" y="357" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ACTION / SCI-FI</text>

  <!-- Title & Details -->
  <text x="200" y="420" font-family="'Poppins', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AVENGERS: ENDGAME</text>
  <text x="200" y="445" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="2">PART OF THE JOURNEY IS THE END</text>

  <!-- Rating & Duration -->
  <g transform="translate(130, 485)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="url(#gold)" font-weight="700">★ 8.4 / 10</text>
    <text x="140" y="0" font-family="'Poppins', sans-serif" font-size="13" fill="#CBD5E1" font-weight="500">⏱ 181 MIN</text>
  </g>

  <!-- Ticket Price Tag -->
  <rect x="50" y="525" width="300" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="200" y="551" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#F8FAFC" text-anchor="middle">
    TICKETS FROM <tspan fill="#F59E0B">₹300.00</tspan>
  </text>
</svg>
